<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EliteSkyline — Sales Receipt</title>
<link rel="stylesheet" href="style.css">
<style>
  .invoice-toolbar{display:flex;gap:8px;align-items:center;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;}
  .invoice-toolbar .spacer{flex:1;}
  .invoice-wrap{max-width:820px;margin:24px auto;padding:0 16px;}
  .invoice-doc{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:40px;margin-bottom:24px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);}

  .invoice-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:26px;}
  .invoice-letterhead{border:1px solid var(--line);border-radius:10px;padding:18px 22px;display:inline-block;}
  .invoice-head .name{font-weight:700;font-size:20px;margin-bottom:8px;color:var(--ink);}
  .invoice-from{font-size:13px;color:var(--ink);white-space:pre-line;line-height:1.7;}
  .invoice-logo{width:132px;height:132px;flex:0 0 auto;object-fit:contain;}
  .invoice-logo[src=""]{display:none;}

  .invoice-title{margin:0 0 20px;font-size:21px;letter-spacing:.04em;font-weight:700;}

  .invoice-billmeta{display:flex;justify-content:space-between;gap:20px;margin-bottom:22px;}
  .invoice-billto .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px;}
  .invoice-billto div{font-size:13px;white-space:pre-line;line-height:1.55;}
  .invoice-meta{flex:0 0 auto;}

  .invoice-doc table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .invoice-doc th{background:#dde1e8;border:none;text-align:left;padding:8px;text-transform:uppercase;font-size:10.5px;letter-spacing:.03em;color:#4b5265;font-weight:700;}
  .invoice-doc th.num{text-align:right;}
  .invoice-doc td{padding:8px;vertical-align:top;white-space:pre-line;border:none;border-bottom:1px solid var(--line);}
  .invoice-doc tr{break-inside:avoid;}

  .invoice-meta table{width:auto;border-collapse:collapse;}
  .invoice-meta td{padding:0 0 5px;border:none;white-space:nowrap;vertical-align:baseline;}
  .invoice-meta tr:last-child td{padding-bottom:0;}
  .invoice-meta .mlabel{font-size:11.5px;color:var(--muted);text-align:right;padding-right:8px;}
  .invoice-meta .mval{color:var(--ink);font-weight:700;font-size:12.5px;text-align:right;}

  .invoice-footer{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);}
  .invoice-footer .thanks{font-size:12px;color:var(--muted);}
  .invoice-balance{font-weight:700;font-size:15px;white-space:nowrap;}
  .invoice-balance .label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-right:14px;}

  .invoice-empty{padding:40px;text-align:center;color:var(--muted);}

  html{-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact;}

  @media print{
    @page{ size: A4; margin: 16mm; }
    body{background:#fff;}
    *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;color-adjust:exact !important;}
    .invoice-toolbar,#loginOverlay,footer{display:none !important;}
    .invoice-wrap{max-width:none;width:100%;margin:0;padding:0;}
    .invoice-doc{border:none;border-radius:0;padding:0;margin:0;width:100%;box-sizing:border-box;page-break-after:always;}
    .invoice-doc:last-child{page-break-after:auto;}
    .invoice-doc table{page-break-inside:auto;}
    .invoice-doc tr{page-break-inside:avoid;}
  }
</style>
</head>
<body>

<!-- LOGIN OVERLAY -->
<div id="loginOverlay">
  <div class="login-box">
    <h1>EliteSkyline</h1>
    <div class="sub">Sign in to view this sales receipt</div>
    <div class="login-error" id="loginError"></div>
    <input type="email" id="loginEmail" placeholder="Email address">
    <input type="password" id="loginPassword" placeholder="Password">
    <button class="btn" id="loginBtn">Sign In</button>
  </div>
</div>

<div class="invoice-toolbar">
  <a href="javascript:history.back()" style="font-size:12px;color:var(--accent);text-decoration:none;font-weight:600;">← Back</a>
  <div class="spacer"></div>
  <button class="btn" id="printBtn">Print / Save as PDF</button>
</div>

<div class="invoice-wrap" id="invoicePreview">
  <div class="invoice-empty">Loading…</div>
</div>

<footer>EliteSkyline Limo</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="workspace-config.js"></script>
<script src="receipt.js"></script>
</body>
</html>
