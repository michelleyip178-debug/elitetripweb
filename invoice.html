<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EliteSkyline — Invoice</title>
<link rel="stylesheet" href="style.css">
<style>
  .invoice-toolbar{display:flex;gap:8px;align-items:center;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;}
  .invoice-toolbar .spacer{flex:1;}
  .invoice-wrap{max-width:820px;margin:24px auto;padding:0 16px;}
  .invoice-doc{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:40px;margin-bottom:24px;}
  .invoice-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:28px;}
  .invoice-head img{max-height:56px;max-width:200px;object-fit:contain;}
  .invoice-head img[src=""]{display:none;}
  .invoice-from{font-size:12px;color:var(--muted);white-space:pre-line;margin-top:8px;}
  .invoice-meta{text-align:right;flex:0 0 auto;white-space:nowrap;}
  .invoice-meta div{font-size:11.5px;color:var(--muted);letter-spacing:.02em;margin-bottom:3px;}
  .invoice-meta b{color:var(--ink);font-weight:700;margin-left:6px;}
  .invoice-billto .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;}
  .invoice-billto div{font-size:13px;white-space:pre-line;}
  .invoice-doc table{width:100%;font-size:12.5px;margin-bottom:0;border-collapse:collapse;}
  .invoice-doc th{background:#f2f3f5;border:none;text-transform:uppercase;font-size:10.5px;letter-spacing:.03em;}
  .invoice-doc td{white-space:pre-line;border:none;vertical-align:top;}
  .invoice-doc tbody tr:last-child td{border-bottom:1px dashed var(--line);}
  .invoice-footer{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-top:16px;}
  .invoice-footer .thanks{font-size:12px;color:var(--muted);}
  .invoice-balance{font-weight:700;font-size:15px;white-space:nowrap;}
  .invoice-balance .label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-right:14px;}
  .invoice-payment{background:#f7f8fa;border-radius:8px;padding:12px 16px;margin-top:18px;font-size:12px;}
  .invoice-payment .label{font-weight:700;margin-bottom:4px;}
  .invoice-empty{padding:40px;text-align:center;color:var(--muted);}

  @media print{
    body{background:#fff;}
    .invoice-toolbar,#loginOverlay,footer{display:none !important;}
    .invoice-wrap{max-width:none;margin:0;padding:0;}
    .invoice-doc{border:none;border-radius:0;padding:0;margin:0;page-break-after:always;}
    .invoice-doc:last-child{page-break-after:auto;}
  }
</style>
</head>
<body>

<!-- LOGIN OVERLAY -->
<div id="loginOverlay">
  <div class="login-box">
    <h1>EliteSkyline</h1>
    <div class="sub">Sign in to view this invoice</div>
    <div class="login-error" id="loginError"></div>
    <input type="email" id="loginEmail" placeholder="Email address">
    <input type="password" id="loginPassword" placeholder="Password">
    <button class="btn" id="loginBtn">Sign In</button>
  </div>
</div>

<div class="invoice-toolbar">
  <a href="javascript:history.back()" style="font-size:12px;color:var(--accent);text-decoration:none;font-weight:600;">← Back</a>
  <div class="spacer"></div>
  <button class="btn" id="printBtn">Print / Save as PDF</button>
</div>

<div class="invoice-wrap" id="invoicePreview">
  <div class="invoice-empty">Loading…</div>
</div>

<footer>EliteSkyline Limo</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="workspace-config.js"></script>
<script src="invoice.js"></script>
</body>
</html>
